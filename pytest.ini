[pytest]
# Without this, CI's bare `pytest -q -m "not live"` used pytest's default globs,
# which match *_test.py as well as test_*.py — sweeping in the manual diagnostics
# scripts/hs_bcc_test.py and scripts/hs_write_test.py. hs_bcc_test.py calls
# sys.exit() at import time as a safety guard, so collection died with an
# INTERNALERROR and the suite ran ZERO tests while reporting failure.
#
# testpaths scopes argument-less runs to the real suite; python_files drops the
# *_test.py suffix entirely, so pointing pytest at the repo root still skips the
# scripts. All 100 files in tests/ use the test_* prefix.
testpaths = tests
python_files = test_*.py
